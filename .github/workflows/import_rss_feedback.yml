name: Import approved RSS feedback

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

concurrency:
  group: import-rss-feedback
  cancel-in-progress: false

jobs:
  import:
    if: github.actor == github.repository_owner && contains(github.event.issue.labels.*.name, 'rss-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Issue and comments as untrusted data
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --slurp > "$RUNNER_TEMP/comment_pages.json"
          python3 - "$RUNNER_TEMP/comment_pages.json" "$RUNNER_TEMP/comments.json" <<'PY'
          import json, sys
          pages = json.load(open(sys.argv[1], encoding="utf-8"))
          json.dump([item for page in pages for item in page], open(sys.argv[2], "w", encoding="utf-8"), ensure_ascii=False)
          PY

      - name: Validate owner approval and import exact final text
        env:
          AUTHORIZED_LOGIN: ${{ github.repository_owner }}
          CLOSING_ACTOR: ${{ github.actor }}
        run: |
          python3 tools/import_issue_feedback.py \
            --issue-file "$RUNNER_TEMP/issue.json" \
            --comments-file "$RUNNER_TEMP/comments.json" \
            --authorized-login "$AUTHORIZED_LOGIN" \
            --closing-actor "$CLOSING_ACTOR"
          python3 tools/validate.py

      - name: Commit append-only feedback event
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if git diff --quiet -- data/publication_events.jsonl; then
            echo "No new feedback event"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publication_events.jsonl
          git commit -m "Import approved RSS feedback from issue #$ISSUE_NUMBER"
          git push origin HEAD:main
