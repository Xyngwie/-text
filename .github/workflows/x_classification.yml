name: X archive stages 1 and 2

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Posts per run (1..30)
        default: '30'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: x-archive-classification
  cancel-in-progress: false

jobs:
  classify:
    if: vars.X_CLASSIFICATION_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify index and classify at most one batch
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_CLASSIFIER_MODEL: ${{ vars.X_CLASSIFIER_MODEL || 'auto' }}
          BATCH_SIZE: ${{ inputs.batch_size || '30' }}
        run: |
          python3 tools/classify_x_batch.py --batch-size "$BATCH_SIZE" | tee "$RUNNER_TEMP/x_result.json"
          cat "$RUNNER_TEMP/x_result.json" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/build_index.py
          python3 tools/validate.py

      - name: Commit classification before notification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/x_posts.jsonl data/x_manifest.json PROGRESS.md
          if test -f data/x_ai_reviews.jsonl; then git add data/x_ai_reviews.jsonl; fi
          if test -d batches/x/auto; then git add batches/x/auto; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Classify one X archive batch (AI stage 2)'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Deliver pending batch reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/report_x_classification.py

      - name: Save notification receipts
        run: |
          if ! test -f data/x_classification_notifications.json; then exit 0; fi
          git add data/x_classification_notifications.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record X classification report delivery'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
